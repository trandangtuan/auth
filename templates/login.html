<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<body>
  <h1>Login</h1>
  <form action="/api/auth/login" method="post">
    <input type="hidden" name="next" value="{{ request.query_params.get('next', '') }}" />
    <label>Login (email or username)</label><br/>
    <input type="text" name="login" required/><br/>
    <label>Password</label><br/>
    <input type="password" name="password" required/><br/>
    <label>Device Name</label><br/>
    <input type="text" name="device_name" placeholder="Chrome on Ubuntu"/><br/>
    <button type="submit">Login</button>
  </form>
  <hr />
  <div>
    <p>Or sign in with Google:</p>
    <a href="/api/auth/google/login?next={{ request.query_params.get('next', '') }}">
      <button type="button">Continue with Google</button>
    </a>
  </div>
</body>
</html>

version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./ai_client.db
      - JWT_SECRET_KEY=replace-with-a-long-random-secret
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=15
      - EMAIL_VERIFICATION_TOKEN_EXPIRE_HOURS=24
      - AUTH_MAX_LOGIN_ATTEMPTS=5
      - AUTH_LOCK_MINUTES=15
      - AUTH_REFRESH_TOKEN_TRANSPORT=cookie
      - AUTH_COOKIE_SECURE=false
      - AUTH_COOKIE_SAMESITE=lax
      - AUTH_COOKIE_DOMAIN=
      - AUTH_RETURN_RESET_TOKEN_IN_RESPONSE=false
      - OAUTH_CLIENTS={"chat-ai":{"secret":"demo-secret","redirect_uris":["http://localhost/auth/callback"]},"web-client":{"secret":"web-secret","redirect_uris":["http://localhost:5174/oauth/callback"]}}
      - SSO_ALLOWED_REDIRECT_URIS=["http://localhost:5174/oauth/callback"]
      - FRONTEND_URL=http://localhost:5173
      - PASSWORD_RESET_URL=http://localhost:5173/reset-password
      - EMAIL_VERIFICATION_URL=http://localhost:5173/verify-email
      - CORS_ORIGINS=["http://localhost:5173"]
    volumes:
      - .:/app

volumes:
  redis_data:
